[project]
name = "enterprise-rag"
version = "0.1.0"
description = "A public, production-minded RAG demo built for learning and portfolio use."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "qdrant-client>=1.12,<1.13",
  "openai>=1.55,<2.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "celery[redis]>=5.4,<6.0",
  "boto3>=1.35,<2.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
