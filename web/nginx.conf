server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: send all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls so the browser never needs a separate origin
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        # SSE streaming support
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }
}
