server {
    listen 80;

    # nginx rejects request bodies over 1 MB by default, so uploads failed here
    # with an HTML 413 before reaching the API. Set slightly above the API's
    # 20 MB MAX_UPLOAD_BYTES: multipart framing makes the body a little larger
    # than the file, and the API should be the one enforcing the limit so the
    # browser receives its readable JSON error rather than nginx's HTML page.
    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: send all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls so the browser never needs a separate origin
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        # SSE streaming support
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }
}
